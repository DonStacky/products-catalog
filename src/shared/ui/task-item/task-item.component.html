<div class="task-item">
  <label class="task-text">
    <input
      type="checkbox"
      [checked]="task.done"
      (change)="toggleDone.emit(task.id)"
    />
    <span
      highlightOnHover
      [ngStyle]="{ textDecoration: completed ? 'line-through' : 'none' }"
      >{{ task.title }}</span
    >
  </label>
  <button (click)="deleteTask.emit(task.id)">delete task</button>
</div>
